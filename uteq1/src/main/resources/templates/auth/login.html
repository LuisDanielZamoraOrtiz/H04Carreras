<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/layout :: head('Iniciar sesión')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="auth-wrapper">
    <div class="auth-card">
        <h1>Iniciar sesión</h1>
        <p class="auth-subtitulo">Accede con tu correo institucional o de aspirante.</p>
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <form class="form" method="post" th:action="@{/login}">
            <div class="form-grupo">
                <label class="form-label" for="correo">Correo electrónico</label>
                <input class="form-input" id="correo" type="email" name="correo" th:value="${correo}" required autocomplete="username">
            </div>
            <div class="form-grupo">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-input" id="password" type="password" name="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primario btn-bloque" type="submit">Entrar</button>
        </form>
        <p class="auth-pie">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
        <p class="form-ayuda">Usuarios de prueba: admin@uteq.edu.mx / admin123; secretaria@uteq.edu.mx / secre123.</p>
    </div>
</main>
</body>
</html>
