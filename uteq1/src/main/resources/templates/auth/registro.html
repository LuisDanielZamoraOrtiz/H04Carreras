<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/layout :: head('Crear cuenta')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="auth-wrapper">
    <div class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="auth-subtitulo">Regístrate como aspirante a la UTEQ.</p>
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <form class="form" method="post" th:action="@{/registro}" th:object="${registroForm}">
            <div class="form-fila">
                <div class="form-grupo">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-input" id="nombre" type="text" th:field="*{nombre}" maxlength="100" required autocomplete="given-name">
                </div>
                <div class="form-grupo">
                    <label class="form-label" for="apellidos">Apellidos</label>
                    <input class="form-input" id="apellidos" type="text" th:field="*{apellidos}" maxlength="100" required autocomplete="family-name">
                </div>
            </div>
            <div class="form-grupo">
                <label class="form-label" for="correo">Correo electrónico</label>
                <input class="form-input" id="correo" type="email" th:field="*{correo}" maxlength="150" required autocomplete="email">
            </div>
            <div class="form-fila">
                <div class="form-grupo">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-input" id="password" type="password" th:field="*{password}" minlength="6" required autocomplete="new-password">
                    <p class="form-ayuda">Mínimo 6 caracteres.</p>
                </div>
                <div class="form-grupo">
                    <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
                    <input class="form-input" id="confirmarPassword" type="password" th:field="*{confirmarPassword}" required autocomplete="new-password">
                </div>
            </div>
            <div class="form-grupo">
                <label class="form-label" for="carreraInteresId">Carrera de interés</label>
                <select class="form-input" id="carreraInteresId" th:field="*{carreraInteresId}">
                    <option value="">Aún no lo decido</option>
                    <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
            </div>
            <button class="btn btn-primario btn-bloque" type="submit">Crear cuenta</button>
        </form>
        <p class="auth-pie">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </div>
</main>
</body>
</html>
